<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Files — 15 Whodunnit Logic Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #1a1a1a;
    color: #e8dcc8;
    min-height: 100vh;
    padding: 20px 12px 60px 12px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  /* ---- Accessibility / DYS mode ---- */
  .a11y-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    background: #241f1a;
    border: 1px solid #6a5c40;
    color: #e8dcc8;
    font-family: Arial, sans-serif;
    font-size: 0.8em;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .a11y-panel {
    position: fixed;
    top: 56px;
    right: 14px;
    z-index: 50;
    background: #241f1a;
    border: 1px solid #6a5c40;
    border-radius: 8px;
    padding: 14px 16px;
    width: 250px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    font-family: Arial, sans-serif;
  }
  .a11y-panel h3 {
    font-size: 0.85em;
    color: #c9a84c;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .a11y-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 0.85em;
    color: #d8ccb2;
  }
  .a11y-row input { width: 16px; height: 16px; }
  .a11y-row label { cursor: pointer; }

  .speak-btn {
    background: transparent;
    border: 1px solid #6a5c40;
    color: #c9a84c;
    font-family: Arial, sans-serif;
    font-size: 0.75em;
    padding: 4px 9px;
    border-radius: 12px;
    cursor: pointer;
    margin-left: 8px;
    white-space: nowrap;
  }
  .speak-btn:hover { border-color: #c9a84c; }
  h2 .speak-btn { vertical-align: middle; }

  /* Dyslexia-friendly font */
  body.dys-font { font-family: 'Lexend', Arial, sans-serif; }
  body.dys-font .case-title,
  body.dys-font h1 { font-family: 'Lexend', Arial, sans-serif; }

  /* Larger text */
  body.dys-large .case-file p,
  body.dys-large .clues li,
  body.dys-large .case-title,
  body.dys-large td.rowhead,
  body.dys-large th.rowhead { font-size: 1.18em; }

  /* Extra spacing */
  body.dys-spacing .case-file p,
  body.dys-spacing .clues li { line-height: 2; letter-spacing: 0.4px; word-spacing: 2px; }

  /* Cream reading background inside text blocks */
  body.dys-cream .case-file {
    background: #f3ecd8;
    border-color: #c9b98a;
  }
  body.dys-cream .case-file h2 { color: #7a5a1e; border-color: #c9b98a; }
  body.dys-cream .case-file p,
  body.dys-cream .clues li span:last-child { color: #2b2416; }
  body.dys-cream .clue-num { background: #7a5a1e; color: #f3ecd8; }

  /* Bionic reading bold */
  .bionic b { color: inherit; font-weight: 700; }

  header { text-align: center; margin-bottom: 22px; }
  .hero {
    margin-bottom: 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #4a4030;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
  }
  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }
  h1 {
    font-size: 1.7em;
    letter-spacing: 1px;
    color: #f0e4c8;
    text-transform: uppercase;
  }
  .subtitle {
    color: #a99a7c;
    font-style: italic;
    margin-top: 4px;
    font-size: 0.95em;
  }

  /* ---- Menu screen ---- */
  .progress-bar-outer {
    background: #241f1a;
    border: 1px solid #4a4030;
    border-radius: 20px;
    height: 22px;
    margin: 18px 0 26px 0;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-inner {
    background: linear-gradient(90deg, #8a6f2e, #c9a84c);
    height: 100%;
    width: 0%;
    transition: width 0.4s;
  }
  .progress-label {
    position: absolute;
    top: 0; left: 0; right: 0;
    text-align: center;
    line-height: 22px;
    font-size: 0.72em;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
    font-weight: bold;
    mix-blend-mode: difference;
    color: #f0e4c8;
  }

  .case-card {
    background: #241f1a;
    border: 1px solid #4a4030;
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .case-card:hover { border-color: #c9a84c; transform: translateY(-1px); }
  .case-num {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #2e281f;
    border: 1px solid #6a5c40;
    color: #c9a84c;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 1.1em;
    text-align: center;
    line-height: 40px;
  }
  .case-card.done .case-num { background: #3a4a2e; border-color: #7fd67f; color: #7fd67f; }
  .case-info { flex: 1; }
  .case-title { font-size: 1.08em; color: #f0e4c8; }
  .case-diff { font-size: 0.78em; color: #a99a7c; font-family: Arial, sans-serif; margin-top: 2px; }
  .case-check { font-size: 1.3em; color: #7fd67f; flex: none; width: 24px; text-align: center; }

  /* ---- Puzzle screen ---- */
  .hidden { display: none !important; }

  .back-btn {
    background: transparent;
    border: 1px solid #6a5c40;
    color: #d8ccb2;
    font-family: Arial, sans-serif;
    font-size: 0.82em;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .case-file {
    background: #241f1a;
    border: 1px solid #4a4030;
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .case-file h2 {
    font-size: 1.05em;
    color: #c9a84c;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    border-bottom: 1px solid #4a4030;
    padding-bottom: 6px;
  }
  .case-file p { line-height: 1.5; color: #d8ccb2; font-size: 0.98em; }

  .clues { list-style: none; margin-top: 10px; }
  .clues li {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    line-height: 1.4;
    font-size: 0.96em;
  }
  .clue-num {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #c9a84c;
    color: #1a1a1a;
    font-weight: bold;
    text-align: center;
    line-height: 24px;
    font-family: Arial, sans-serif;
    font-size: 0.85em;
  }

  .grid-scroll { overflow-x: auto; padding-bottom: 6px; }
  table.puzzle {
    border-collapse: collapse;
    margin: 0 auto;
    background: #241f1a;
    border: 1px solid #4a4030;
  }
  table.puzzle th, table.puzzle td {
    border: 1px solid #4a4030;
    text-align: center;
    padding: 0;
  }
  table.puzzle th {
    background: #2e281f;
    color: #d8ccb2;
    font-size: 0.76em;
    font-family: Arial, sans-serif;
    white-space: nowrap;
  }
  th.rot {
    height: 170px;
    vertical-align: bottom;
    padding: 8px 3px 8px;
  }
  th.rot > div {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
    display: inline-block;
    margin: 0 auto;
    line-height: 1.15;
  }
  th.rowhead {
    text-align: right;
    padding: 0 10px;
    background: #2e281f;
    font-family: Georgia, serif;
    font-size: 0.88em;
  }
  td.corner { background: #1a1a1a; border: none; }
  td.cell {
    width: 40px; height: 40px;
    cursor: pointer;
    font-size: 1.05em;
    color: #c9a84c;
    user-select: none;
    transition: background 0.15s;
  }
  td.cell:hover { background: #33291b; }
  td.blocked { background: #150f0a; cursor: not-allowed; }
  td.section-gap-right { border-right: 3px solid #c9a84c33; }
  tr.section-gap-bottom td, tr.section-gap-bottom th { border-bottom: 3px solid #c9a84c33; }

  .controls { text-align: center; margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.action {
    font-family: Georgia, serif;
    background: #c9a84c;
    color: #1a1a1a;
    border: none;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 0.95em;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  button.secondary {
    background: transparent;
    border: 1px solid #6a5c40;
    color: #d8ccb2;
    font-family: Georgia, serif;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 0.95em;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
  }

  #feedback {
    text-align: center;
    margin-top: 16px;
    font-size: 1.05em;
    min-height: 1.4em;
  }
  #feedback.win { color: #7fd67f; }
  #feedback.lose { color: #e08a8a; }

  .solution-box {
    display: none;
    margin-top: 18px;
    background: #241f1a;
    border: 1px dashed #c9a84c;
    border-radius: 6px;
    padding: 14px 18px;
    text-align: center;
    line-height: 1.7;
  }
  .legend {
    text-align: center;
    color: #a99a7c;
    font-size: 0.8em;
    margin-top: 10px;
  }
  footer {
    text-align: center;
    color: #6a5c40;
    font-size: 0.8em;
    margin-top: 30px;
  }
</style>
</head>
<body>

<button class="a11y-toggle" id="a11yToggle">&#9881; Reading Settings</button>
<div class="a11y-panel hidden" id="a11yPanel">
  <h3>Reading Settings</h3>
  <div class="a11y-row">
    <input type="checkbox" id="optFont">
    <label for="optFont">Dyslexia-friendly font</label>
  </div>
  <div class="a11y-row">
    <input type="checkbox" id="optLarge">
    <label for="optLarge">Larger text</label>
  </div>
  <div class="a11y-row">
    <input type="checkbox" id="optSpacing">
    <label for="optSpacing">Extra letter &amp; line spacing</label>
  </div>
  <div class="a11y-row">
    <input type="checkbox" id="optCream">
    <label for="optCream">Cream reading background</label>
  </div>
  <div class="a11y-row">
    <input type="checkbox" id="optBionic">
    <label for="optBionic">Bionic reading (bold word-starts)</label>
  </div>
</div>

<script>
(function () {
  var levels = JSON.parse(document.getElementById('levelData').textContent);
  var STORAGE_KEY = 'caseFiles3e_progress';
  var progress = loadProgress();
  var currentLevel = null;
  var state = {};
  var totalCellCount = 0;
  var SETTINGS_KEY = 'caseFiles3e_settings';
  var settings = loadSettings();

  function loadSettings() {
    var defaults = { font: false, large: false, spacing: false, cream: false, bionic: false };
    try {
      var raw = window.localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        for (var k in defaults) { if (parsed[k] === undefined) parsed[k] = defaults[k]; }
        return parsed;
      }
    } catch (e) {}
    return defaults;
  }
  function saveSettings() {
    try { window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }
  function applySettings() {
    var b = document.body;
    b.classList.toggle('dys-font', !!settings.font);
    b.classList.toggle('dys-large', !!settings.large);
    b.classList.toggle('dys-spacing', !!settings.spacing);
    b.classList.toggle('dys-cream', !!settings.cream);
    document.getElementById('optFont').checked = !!settings.font;
    document.getElementById('optLarge').checked = !!settings.large;
    document.getElementById('optSpacing').checked = !!settings.spacing;
    document.getElementById('optCream').checked = !!settings.cream;
    document.getElementById('optBionic').checked = !!settings.bionic;
  }

  var cachedVoices = [];
  function refreshVoices() {
    if (window.speechSynthesis) cachedVoices = window.speechSynthesis.getVoices();
  }
  if (window.speechSynthesis) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }

  function pickEnglishVoice() {
    var i;
    for (i = 0; i < cachedVoices.length; i++) {
      if (/^en-GB/i.test(cachedVoices[i].lang)) return cachedVoices[i];
    }
    for (i = 0; i < cachedVoices.length; i++) {
      if (/^en/i.test(cachedVoices[i].lang)) return cachedVoices[i];
    }
    return null;
  }

  function doSpeak(text) {
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    var voice = pickEnglishVoice();
    if (voice) { utter.voice = voice; utter.lang = voice.lang; }
    else { utter.lang = 'en-GB'; }
    utter.rate = 0.92;
    window.speechSynthesis.speak(utter);
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      refreshVoices();
      if (cachedVoices.length === 0) {
        window.speechSynthesis.onvoiceschanged = function () {
          refreshVoices();
          doSpeak(text);
        };
        window.speechSynthesis.getVoices();
        return;
      }
      doSpeak(text);
    } catch (e) {}
  }

  function loadProgress() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function saveProgress() {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
  }

  function renderMenu() {
    var list = document.getElementById('caseList');
    list.innerHTML = '';
    var doneCount = 0;
    for (var i = 0; i < levels.length; i++) {
      var lvl = levels[i];
      var isDone = !!progress[lvl.id];
      if (isDone) doneCount++;
      var card = document.createElement('div');
      card.className = 'case-card' + (isDone ? ' done' : '');
      card.setAttribute('data-id', lvl.id);

      var num = document.createElement('div');
      num.className = 'case-num';
      num.textContent = lvl.id;
      card.appendChild(num);

      var info = document.createElement('div');
      info.className = 'case-info';
      var t = document.createElement('div');
      t.className = 'case-title';
      t.textContent = lvl.title;
      var d = document.createElement('div');
      d.className = 'case-diff';
      d.textContent = lvl.difficulty + ' \u00b7 ' + lvl.suspects.length + ' suspects';
      info.appendChild(t);
      info.appendChild(d);
      card.appendChild(info);

      var check = document.createElement('div');
      check.className = 'case-check';
      check.textContent = isDone ? '\u2713' : '';
      card.appendChild(check);

      card.addEventListener('click', (function (levelId) {
        return function () { openLevel(levelId); };
      })(lvl.id));

      list.appendChild(card);
    }
    var pct = Math.round((doneCount / levels.length) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = doneCount + ' / ' + levels.length + ' cases solved';
  }

  function openLevel(levelId) {
    var lvl = null;
    for (var i = 0; i < levels.length; i++) {
      if (levels[i].id === levelId) { lvl = levels[i]; break; }
    }
    if (!lvl) return;
    currentLevel = lvl;
    state = {};

    renderPuzzleText(lvl);
    buildGrid(lvl);

    var sol = lvl.solution;
    var solBox = document.getElementById('solutionBox');
    var html = '<strong>Case Closed:</strong><br>';
    for (var s = 0; s < lvl.suspects.length; s++) {
      var name = lvl.suspects[s];
      html += name + ' \u2014 ' + sol.hideout[name] + ' \u2014 ' + sol.tell[name] + '<br>';
    }
    solBox.innerHTML = html;
    solBox.style.display = 'none';

    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';

    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('puzzleScreen').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function bionicText(str) {
    var words = str.split(' ');
    var out = [];
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var letters = w.replace(/[^a-zA-Z]/g, '').length;
      var boldLen = Math.ceil(letters * 0.45);
      if (boldLen < 1) boldLen = 1;
      var count = 0, splitAt = 0;
      for (var j = 0; j < w.length; j++) {
        if (/[a-zA-Z]/.test(w.charAt(j))) count++;
        if (count === boldLen) { splitAt = j + 1; break; }
      }
      if (splitAt === 0) { out.push(w); continue; }
      out.push('<b>' + w.substring(0, splitAt) + '</b>' + w.substring(splitAt));
    }
    return out.join(' ');
  }

  function renderPuzzleText(lvl) {
    document.getElementById('pzTitle').textContent = lvl.title;

    var storyEl = document.getElementById('pzStory');
    if (settings.bionic) {
      storyEl.innerHTML = bionicText(lvl.story);
      storyEl.classList.add('bionic');
    } else {
      storyEl.textContent = lvl.story;
      storyEl.classList.remove('bionic');
    }

    var cluesEl = document.getElementById('pzClues');
    cluesEl.innerHTML = '';
    for (var c = 0; c < lvl.clues.length; c++) {
      var li = document.createElement('li');
      var span = document.createElement('span');
      span.className = 'clue-num';
      span.textContent = (c + 1);
      var text = document.createElement('span');
      if (settings.bionic) {
        text.innerHTML = bionicText(lvl.clues[c]);
        text.classList.add('bionic');
      } else {
        text.textContent = lvl.clues[c];
      }
      li.appendChild(span);
      li.appendChild(text);
      cluesEl.appendChild(li);
    }
  }

  function cellKey(row, col) { return row + '|' + col; }


  function buildGrid(lvl) {
    var suspects = lvl.suspects;
    var catAValues = lvl.catA.values;
    var catBValues = lvl.catB.values;
    var cols = catAValues.concat(catBValues);

    var table = document.getElementById('grid');
    table.innerHTML = '';

    var headRow = document.createElement('tr');
    var corner = document.createElement('td');
    corner.className = 'corner';
    headRow.appendChild(corner);
    for (var c = 0; c < cols.length; c++) {
      var th = document.createElement('th');
      th.className = 'rot';
      if (c === catAValues.length - 1) th.classList.add('section-gap-right');
      var div = document.createElement('div');
      div.textContent = cols[c];
      th.appendChild(div);
      headRow.appendChild(th);
    }
    table.appendChild(headRow);

    var allRows = suspects.concat(catAValues);

    for (var r = 0; r < allRows.length; r++) {
      var rowName = allRows[r];
      var isValueRow = r >= suspects.length;
      var tr = document.createElement('tr');
      if (r === suspects.length - 1) tr.classList.add('section-gap-bottom');

      var rowHead = document.createElement('th');
      rowHead.className = 'rowhead';
      rowHead.textContent = rowName;
      tr.appendChild(rowHead);

      for (var c2 = 0; c2 < cols.length; c2++) {
        var colName = cols[c2];
        var isValueCol = c2 < catAValues.length;
        var td = document.createElement('td');

        if (isValueRow && isValueCol) {
          td.className = 'blocked';
          if (c2 === catAValues.length - 1) td.classList.add('section-gap-right');
          tr.appendChild(td);
          continue;
        }

        td.className = 'cell';
        if (c2 === catAValues.length - 1) td.classList.add('section-gap-right');
        td.setAttribute('data-row', rowName);
        td.setAttribute('data-col', colName);
        td.textContent = '';
        td.addEventListener('click', onCellClick);
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }

    totalCellCount = suspects.length * (catAValues.length + catBValues.length) + (catAValues.length * catBValues.length);
    updateRevealButtonState();
  }

  function updateRevealButtonState() {
    var filled = 0;
    for (var key in state) {
      if (state.hasOwnProperty(key) && state[key] !== 0) filled++;
    }
    var btn = document.getElementById('revealBtn');
    var remaining = totalCellCount - filled;
    if (remaining <= 0) {
      btn.disabled = false;
      btn.title = '';
    } else {
      btn.disabled = true;
      btn.title = 'Fill in every cell first (' + remaining + ' left)';
    }
  }

  function onCellClick(e) {
    var td = e.currentTarget;
    var key = cellKey(td.getAttribute('data-row'), td.getAttribute('data-col'));
    var cur = state[key] || 0;
    cur = (cur + 1) % 3;
    state[key] = cur;
    if (cur === 0) { td.textContent = ''; td.style.color = '#c9a84c'; }
    else if (cur === 1) { td.textContent = '\u2713'; td.style.color = '#7fd67f'; }
    else { td.textContent = '\u2717'; td.style.color = '#e08a8a'; }
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    updateRevealButtonState();
  }

  function checkSolution() {
    var lvl = currentLevel;
    var suspects = lvl.suspects;
    var catAValues = lvl.catA.values;
    var catBValues = lvl.catB.values;
    var sol = lvl.solution;
    var correct = true;

    for (var s = 0; s < suspects.length; s++) {
      var name = suspects[s];
      var correctA = sol.hideout[name];
      var correctB = sol.tell[name];
      for (var a = 0; a < catAValues.length; a++) {
        var key = cellKey(name, catAValues[a]);
        var val = state[key] || 0;
        var shouldBeYes = (catAValues[a] === correctA);
        if (shouldBeYes && val !== 1) correct = false;
        if (!shouldBeYes && val === 1) correct = false;
      }
      for (var b = 0; b < catBValues.length; b++) {
        var key2 = cellKey(name, catBValues[b]);
        var val2 = state[key2] || 0;
        var shouldBeYes2 = (catBValues[b] === correctB);
        if (shouldBeYes2 && val2 !== 1) correct = false;
        if (!shouldBeYes2 && val2 === 1) correct = false;
      }
    }

    var fb = document.getElementById('feedback');
    if (correct) {
      fb.textContent = 'Case closed! Well done, detective.';
      fb.className = 'win';
      progress[lvl.id] = true;
      saveProgress();
    } else {
      fb.textContent = 'Not quite \u2014 re-check your clues, detective.';
      fb.className = 'lose';
    }
  }

  function resetGrid() {
    state = {};
    buildGrid(currentLevel);
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    document.getElementById('solutionBox').style.display = 'none';
  }

  function revealSolution() {
    var box = document.getElementById('solutionBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }

  function backToMenu() {
    document.getElementById('puzzleScreen').classList.add('hidden');
    document.getElementById('menuScreen').classList.remove('hidden');
    renderMenu();
    window.scrollTo(0, 0);
  }

  document.getElementById('checkBtn').addEventListener('click', checkSolution);
  document.getElementById('resetBtn').addEventListener('click', resetGrid);
  document.getElementById('revealBtn').addEventListener('click', revealSolution);
  document.getElementById('backBtn').addEventListener('click', backToMenu);

  document.getElementById('a11yToggle').addEventListener('click', function () {
    document.getElementById('a11yPanel').classList.toggle('hidden');
  });
  document.getElementById('optFont').addEventListener('change', function (e) {
    settings.font = e.target.checked; saveSettings(); applySettings();
  });
  document.getElementById('optLarge').addEventListener('change', function (e) {
    settings.large = e.target.checked; saveSettings(); applySettings();
  });
  document.getElementById('optSpacing').addEventListener('change', function (e) {
    settings.spacing = e.target.checked; saveSettings(); applySettings();
  });
  document.getElementById('optCream').addEventListener('change', function (e) {
    settings.cream = e.target.checked; saveSettings(); applySettings();
  });
  document.getElementById('optBionic').addEventListener('change', function (e) {
    settings.bionic = e.target.checked; saveSettings(); applySettings();
    if (currentLevel) renderPuzzleText(currentLevel);
  });
  document.getElementById('speakStoryBtn').addEventListener('click', function () {
    if (currentLevel) speak(currentLevel.story);
  });
  document.getElementById('speakCluesBtn').addEventListener('click', function () {
    if (currentLevel) speak(currentLevel.clues.join('. '));
  });

  applySettings();
  renderMenu();
})();
</script>

</body>
</html>
